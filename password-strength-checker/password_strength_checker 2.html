<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Strength Checker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom transitions for smooth UI updates */
        .meter-segment {
            transition: all 0.3s ease-in-out;
        }
        .req-icon, .req-text {
            transition: all 0.2s ease;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-100 to-slate-200 min-h-screen flex items-center justify-center p-4">

    <main class="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden">
        <!-- Header -->
        <div class="bg-slate-800 p-6 text-white">
            <h1 class="text-2xl font-bold flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                </svg>
                SecurePass
            </h1>
            <p class="text-slate-300 text-sm mt-2">Check your password strength in real-time.</p>
        </div>

        <!-- Content -->
        <div class="p-6">
            <div class="relative mb-6">
                <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Enter Password</label>
                <div class="relative rounded-lg shadow-sm">
                    <input type="password" id="password" 
                        class="block w-full pl-4 pr-10 py-3 border border-slate-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 transition-colors bg-slate-50 text-slate-900" 
                        placeholder="Start typing..." autocomplete="new-password">
                    <button type="button" id="toggleVisibility" class="absolute inset-y-0 right-0 px-3 flex items-center text-slate-400 hover:text-slate-600 focus:outline-none">
                        <!-- Eye Icon (Hidden by default, shown when text is present) -->
                        <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path d="M10 12a2 2 0 100-4 2 2 0 000 4z" />
                            <path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd" />
                        </svg>
                        <!-- Eye Off Icon (Shown when password is visible) -->
                        <svg id="eyeOffIcon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 hidden" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M3.707 2.293a1 1 0 00-1.414 1.414l14 14a1 1 0 001.414-1.414l-1.473-1.473A10.014 10.014 0 0019.542 10C18.268 5.943 14.478 3 10 3a9.958 9.958 0 00-4.512 1.074l-1.78-1.78zm4.261 4.26l1.514 1.515a2.003 2.003 0 012.45 2.45l1.514 1.514a4 4 0 00-5.478-5.478z" clip-rule="evenodd" />
                            <path d="M12.454 16.697L9.75 13.992a4 4 0 01-3.742-3.741L2.335 6.578A9.98 9.98 0 00.458 10c1.274 4.057 5.065 7 9.542 7 .847 0 1.669-.105 2.454-.303z" />
                        </svg>
                    </button>
                </div>
            </div>

            <div class="mb-2 flex justify-between items-end">
                <span class="text-sm font-semibold text-slate-700">Password Strength</span>
                <span id="strengthLabel" class="text-sm font-bold text-slate-400">Not assessed</span>
            </div>
            <div class="flex gap-1.5 h-2 w-full mb-6">
                <div id="meter-1" class="meter-segment w-1/5 bg-slate-200 rounded-l-full"></div>
                <div id="meter-2" class="meter-segment w-1/5 bg-slate-200"></div>
                <div id="meter-3" class="meter-segment w-1/5 bg-slate-200"></div>
                <div id="meter-4" class="meter-segment w-1/5 bg-slate-200"></div>
                <div id="meter-5" class="meter-segment w-1/5 bg-slate-200 rounded-r-full"></div>
            </div>

            <div>
                <p class="text-sm font-medium text-slate-600 mb-3">Your password must contain:</p>
                <ul class="space-y-2 text-sm" id="requirementsList">
                    <li id="req-length" class="flex items-center gap-2 text-slate-500">
                        <span class="req-icon w-5 h-5 rounded-full border-2 border-slate-300 flex items-center justify-center shrink-0"></span>
                        <span class="req-text">At least 8 characters</span>
                    </li>
                    <li id="req-upper" class="flex items-center gap-2 text-slate-500">
                        <span class="req-icon w-5 h-5 rounded-full border-2 border-slate-300 flex items-center justify-center shrink-0"></span>
                        <span class="req-text">At least one uppercase letter (A-Z)</span>
                    </li>
                    <li id="req-lower" class="flex items-center gap-2 text-slate-500">
                        <span class="req-icon w-5 h-5 rounded-full border-2 border-slate-300 flex items-center justify-center shrink-0"></span>
                        <span class="req-text">At least one lowercase letter (a-z)</span>
                    </li>
                    <li id="req-num" class="flex items-center gap-2 text-slate-500">
                        <span class="req-icon w-5 h-5 rounded-full border-2 border-slate-300 flex items-center justify-center shrink-0"></span>
                        <span class="req-text">At least one number (0-9)</span>
                    </li>
                    <li id="req-special" class="flex items-center gap-2 text-slate-500">
                        <span class="req-icon w-5 h-5 rounded-full border-2 border-slate-300 flex items-center justify-center shrink-0"></span>
                        <span class="req-text">At least one special character (!@#$...)</span>
                    </li>
                </ul>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const passwordInput = document.getElementById('password');
            const toggleVisibilityBtn = document.getElementById('toggleVisibility');
            const eyeIcon = document.getElementById('eyeIcon');
            const eyeOffIcon = document.getElementById('eyeOffIcon');
            const strengthLabel = document.getElementById('strengthLabel');
            
            // Meter segments
            const meters = [
                document.getElementById('meter-1'),
                document.getElementById('meter-2'),
                document.getElementById('meter-3'),
                document.getElementById('meter-4'),
                document.getElementById('meter-5')
            ];

            // Requirement criteria and their corresponding DOM elements
            const criteria = [
                { id: 'req-length', regex: /.{8,}/ },
                { id: 'req-upper', regex: /[A-Z]/ },
                { id: 'req-lower', regex: /[a-z]/ },
                { id: 'req-num', regex: /[0-9]/ },
                { id: 'req-special', regex: /[^A-Za-z0-9]/ } // Matches anything not alphanumeric
            ];

            // Setup checkmark SVG for satisfied requirements
            const checkMarkSVG = `<svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 text-white" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
            </svg>`;

            toggleVisibilityBtn.addEventListener('click', () => {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                
                // Toggle icons
                if (type === 'text') {
                    eyeIcon.classList.add('hidden');
                    eyeOffIcon.classList.remove('hidden');
                } else {
                    eyeIcon.classList.remove('hidden');
                    eyeOffIcon.classList.add('hidden');
                }
            });

            passwordInput.addEventListener('input', (e) => {
                const val = e.target.value;
                let score = 0;

                // Handle empty state
                if (val.length === 0) {
                    resetUI();
                    return;
                }

                // Check criteria and update list UI
                criteria.forEach(criterion => {
                    const el = document.getElementById(criterion.id);
                    const icon = el.querySelector('.req-icon');
                    const text = el.querySelector('.req-text');
                    
                    if (criterion.regex.test(val)) {
                        score++;
                        // Style as met
                        icon.innerHTML = checkMarkSVG;
                        icon.classList.remove('border-slate-300', 'bg-transparent');
                        icon.classList.add('bg-green-500', 'border-green-500');
                        text.classList.remove('text-slate-500');
                        text.classList.add('text-slate-300', 'line-through'); // Dim and strikethrough
                    } else {
                        // Style as unmet
                        icon.innerHTML = '';
                        icon.classList.add('border-slate-300', 'bg-transparent');
                        icon.classList.remove('bg-green-500', 'border-green-500');
                        text.classList.add('text-slate-500');
                        text.classList.remove('text-slate-300', 'line-through');
                    }
                });

                updateMeter(score);
            });

            function updateMeter(score) {
                // Determine color and label based on score (1 to 5)
                let colorClass = 'bg-slate-200';
                let label = '';
                let labelColor = 'text-slate-400';

                switch(score) {
                    case 1:
                        colorClass = 'bg-red-500';
                        label = 'Very Weak';
                        labelColor = 'text-red-500';
                        break;
                    case 2:
                        colorClass = 'bg-orange-500';
                        label = 'Weak';
                        labelColor = 'text-orange-500';
                        break;
                    case 3:
                        colorClass = 'bg-yellow-400';
                        label = 'Medium';
                        labelColor = 'text-yellow-500';
                        break;
                    case 4:
                        colorClass = 'bg-green-400';
                        label = 'Strong';
                        labelColor = 'text-green-500';
                        break;
                    case 5:
                        colorClass = 'bg-green-600';
                        label = 'Very Strong';
                        labelColor = 'text-green-600';
                        break;
                }

                // Update text label
                strengthLabel.textContent = label;
                strengthLabel.className = `text-sm font-bold ${labelColor}`;

                // Fill segments up to the score with the specific color, leave rest gray
                meters.forEach((meter, index) => {
                    // Remove all possible color classes first
                    meter.className = `meter-segment w-1/5 ${index === 0 ? 'rounded-l-full' : ''} ${index === 4 ? 'rounded-r-full' : ''}`;
                    
                    if (index < score) {
                        meter.classList.add(colorClass);
                    } else {
                        meter.classList.add('bg-slate-200');
                    }
                });
            }

            function resetUI() {
                strengthLabel.textContent = 'Not assessed';
                strengthLabel.className = 'text-sm font-bold text-slate-400';
                
                meters.forEach((meter, index) => {
                    meter.className = `meter-segment w-1/5 bg-slate-200 ${index === 0 ? 'rounded-l-full' : ''} ${index === 4 ? 'rounded-r-full' : ''}`;
                });

                criteria.forEach(criterion => {
                    const el = document.getElementById(criterion.id);
                    const icon = el.querySelector('.req-icon');
                    const text = el.querySelector('.req-text');
                    
                    icon.innerHTML = '';
                    icon.className = 'req-icon w-5 h-5 rounded-full border-2 border-slate-300 flex items-center justify-center shrink-0 bg-transparent';
                    text.className = 'req-text text-slate-500';
                });
            }
        });
    </script>
</body>
</html>
